<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zig-orbit-mindmap</title>
  <style>
    /* Colours: tech-trio.svg palette, as in src/main.zig and src/sim.zig. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1414; color: #c8a878;
                 font: 14px system-ui, sans-serif; }
    /* The app sizes the canvas to the whole viewport (raylib's resizable
       window, main.zig: resize), at any aspect; CSS only pins it in place.
       touch-action: drags and pinches steer the camera, not the page. */
    canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
    /* The title and status float over the scene and never catch input. */
    h1, #status { position: fixed; z-index: 1; margin: 0; pointer-events: none; }
    /* Top left, opposite the app's readout (top right). A narrow phone has
       no room for both on one line, so the subtitle drops below the name. */
    h1 { left: 12px; top: 8px; font-size: 20px; font-weight: 600; }
    h1 span { color: #2e7e7e; font-weight: normal; }
    @media (max-width: 600px) { h1 span { display: block; } }
    #status { left: 0; right: 0; top: 50%; text-align: center; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <h1>zig-orbit-mindmap <span>raylib + flecs</span></h1>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">loading…</div>
  <script>
    var started = false;
    var Module = {
      canvas: document.getElementById("canvas"),
      // Fetch index.wasm with index.js's ?v= tag (web/stamp.sh), so the
      // browser cache can't pair a new index.js with an old index.wasm.
      // (Pages ignores the tag; an index.html cached across a deploy can
      // still fetch mismatched files for up to its 10-minute max-age.)
      locateFile: function (path, prefix) {
        var js = document.querySelector('script[src^="index.js"]');
        return prefix + path + (js ? new URL(js.src).search : "");
      },
      onRuntimeInitialized: function () { started = true; },
      setStatus: function (text) { document.getElementById("status").textContent = text; },
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
    };
    // raylib resizes the canvas on window "resize", reading innerWidth/Height.
    // Some mobile browsers (iOS Safari) still report the old size while a
    // rotation is under way, so ask again once it has settled.
    addEventListener("orientationchange", function () {
      setTimeout(function () { dispatchEvent(new Event("resize")); }, 300);
    });
    // Only startup failures replace the canvas status; later errors just log.
    window.onerror = function () { if (!started) Module.setStatus("failed to start — see the console"); };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
